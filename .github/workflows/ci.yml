name: CI — RazorSentinel-AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: ⎇ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🔍 Lint with flake8
        run: |
          # Fail on syntax errors or undefined names; warn on style issues
          flake8 src/ tests/ app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Warn but don't fail on line-length or complexity
          flake8 src/ tests/ app.py \
            --count \
            --exit-zero \
            --max-line-length=120 \
            --statistics

      - name: 🏗️ Generate synthetic data & train verifier
        run: |
          python src/data_generator.py
          python src/train_verifier.py
        env:
          PYTHONPATH: .

      - name: 🧪 Run test suite
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

      - name: 📊 Run evaluation pipeline
        run: |
          python src/evaluate.py
        env:
          PYTHONPATH: .

      - name: 📈 Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-artifacts-py${{ matrix.python-version }}
          path: |
            data/metrics.json
            data/cost_curve.png
            data/confusion_matrix.png
          retention-days: 7
